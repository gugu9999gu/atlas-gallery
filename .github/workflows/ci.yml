name: ATLAS preview regression checks
on:
  push:
    paths:
      - src/**
      - data/**
      - scripts/**
      - worker.mjs
      - public/index.html
      - requirements-test.txt
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - src/**
      - data/**
      - scripts/**
      - worker.mjs
      - public/index.html
      - requirements-test.txt
      - .github/workflows/ci.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check JavaScript syntax and compile the standalone app
        run: |
          node --check src/app.js
          for file in src/previews/*.js; do node --check "$file"; done
          node --check worker.mjs
          python scripts/build.py
      - name: Install pinned test tooling
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Test previews, responsive UI, language and reduced motion
        run: |
          python scripts/test-previews.py
          python scripts/build.py
      - name: Ensure committed data and build match editable source
        run: git diff --exit-code -- public/index.html data/atlas-gallery-bilingual.json
