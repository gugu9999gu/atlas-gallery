name: ATLAS v3.18 staging browser QA
on:
  push:
    paths:
      - production/v318/**
      - .github/workflows/atlas-v318-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Syntax-check standalone GIS overlay
        run: node --check production/v318/atlas-v318.js
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          if ! command -v google-chrome >/dev/null 2>&1; then
            python -m playwright install --with-deps chromium
          fi
      - name: Validate staging, 6 viewport/language matrices and 24 HTML exports
        env:
          ATLAS_STAGING_URL: https://atlas-gallery-v318-preview.gytlrgpfl96.workers.dev
        run: python production/v318/test-live.py
      - name: Save regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-v318-qa
          path: production/v318/qa-result.json
          if-no-files-found: ignore
